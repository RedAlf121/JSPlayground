<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="color-scheme" content="dark">
    <meta name="theme-color" content="#141218">
    <title>Playground</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/addon/selection/active-line.min.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <header class="top-app-bar">
        <h1 class="top-app-bar__title">Playground</h1>
        <p class="top-app-bar__subtitle">HTML · CSS · JavaScript</p>
    </header>

    <main class="workspace">
        <div class="editors">
            <section class="panel panel--html" aria-labelledby="html-heading">
                <header class="panel__header">
                    <h2 class="panel__title" id="html-heading">HTML</h2>
                </header>
                <label class="visually-hidden" for="html">Código HTML</label>
                <textarea name="html" id="html" spellcheck="false" oninput="editPreview()"></textarea>
            </section>

            <section class="panel panel--css" aria-labelledby="css-heading">
                <header class="panel__header">
                    <h2 class="panel__title" id="css-heading">CSS</h2>
                </header>
                <label class="visually-hidden" for="css">Código CSS</label>
                <textarea name="css" id="css" spellcheck="false" oninput="editPreview()"></textarea>
            </section>

            <section class="panel panel--js" aria-labelledby="js-heading">
                <header class="panel__header">
                    <h2 class="panel__title" id="js-heading">JavaScript</h2>
                </header>
                <label class="visually-hidden" for="js">Código JavaScript</label>
                <textarea name="js" id="js" spellcheck="false" oninput="editPreview()"></textarea>
            </section>
        </div>

        <div class="output">
            <section class="panel panel--preview" aria-labelledby="preview-heading">
                <header class="panel__header">
                    <h2 class="panel__title" id="preview-heading">Vista previa</h2>
                </header>
                <iframe class="render" title="Vista previa del código"></iframe>
            </section>

            <section class="panel panel--console" aria-labelledby="console-heading">
                <header class="panel__header">
                    <h2 class="panel__title" id="console-heading">Consola</h2>
                </header>
                <div class="console" role="log" aria-live="polite"></div>
            </section>
        </div>
    </main>
</body>
</html>
