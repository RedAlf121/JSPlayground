<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Local Playground</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/codemirror.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/htmlmixed/htmlmixed.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/css/css.min.js" defer></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.5/mode/javascript/javascript.min.js" defer></script>
    <script src="main.js" defer></script>
</head>
<body>
    <div id="editor">
        <details id="html-editor">
            <summary>HTML</summary>
            <textarea name="html" id="html" oninput="editPreview()"></textarea>
        </details>
        <details id="css-editor">
            <summary>CSS</summary>
            <textarea name="css" id="css" oninput="editPreview()"></textarea>
        </details>
        <details id="js-editor">
            <summary>Javascript</summary>
            <textarea name="js" id="js" oninput="editPreview()"></textarea>
        </details>
    </div>
    <div id="output">
        <h3>Preview</h3>
        <iframe class="render" title="Preview"></iframe>
        <h3>Console</h3>
        <div class="console"></div>
    </div>
</body>
</html>
